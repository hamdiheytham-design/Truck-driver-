.name: Build Driver Pro APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Android SDK
    uses: android-actions/setup-android@v3

  - name: Extract project
    run: |
      unzip -o DriverPro_V2.8_Android_Project.zip -d project
      find project -name gradlew

  - name: Build APK
    run: |
      cd project/DriverPro
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Driver-Pro-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
